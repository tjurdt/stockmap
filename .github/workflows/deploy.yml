name: deploy

on:
  push:
    branches: [main]
  # 資料類 workflow 用預設 GITHUB_TOKEN commit，不會觸發 push 事件；
  # 改用 workflow_run 在資料更新後接續部署。
  workflow_run:
    workflows: [fetch-twse, backfill, rank-universe]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run 觸發時，只有在 fetch-twse 成功後才部署
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compute Pages base path
        run: echo "VITE_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Build web
        working-directory: web
        env:
          VITE_QUOTE_URL: ${{ vars.VITE_QUOTE_URL }}
        run: |
          npm ci
          npm run build

      - name: Bundle data snapshot
        run: cp -r data web/dist/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
