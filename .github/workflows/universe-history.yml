name: universe-history

# 重建回測選股池（過去 N 年每週市值前段的聯集）+ 深度回填其歷史。手動觸發。
# 需要 FINMIND_TOKEN secret（免費註冊）。跑一次約 15–25 分鐘；建議每 3～6 個月重跑一次。
on:
  schedule:
    - cron: '0 2 1 1,4,7,10 *' # 每季 1 號 10:00 TPE，讓回測選股池保持新鮮
  workflow_dispatch:
    inputs:
      years:
        description: '回看幾年'
        default: '3'
      top:
        description: '每週取前 M 大（>50 的緩衝）'
        default: '60'

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e pipeline

      - name: Build backtest universe (TWSE MI_INDEX 週五快照聯集)
        run: python -m twse_pipeline.universe_history --years "${{ inputs.years || '3' }}" --top "${{ inputs.top || '60' }}"

      - name: Restore backfill cache
        uses: actions/cache@v4
        with:
          path: data/history/_backfill
          key: backfill-cache

      - name: Deep backfill + rebuild factor history
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m twse_pipeline.backfill

      - name: Refresh snapshot
        run: python -m twse_pipeline.daily

      - name: Validate
        run: python schema/validate.py

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ schema/backtest_universe.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "backtest universe: $(date -u +%Y-%m-%d)"
          git push
