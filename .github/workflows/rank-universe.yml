name: rank-universe

# 每週一盤後重排市值前 20 名單；新進榜股自動回填歷史。
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e pipeline

      - name: Re-rank universe
        id: rank
        run: python -m twse_pipeline.universe_rank

      - name: Backfill new constituents
        if: steps.rank.outputs.added != ''
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m twse_pipeline.backfill --codes "${{ steps.rank.outputs.added }}"

      - name: Refresh snapshot
        run: python -m twse_pipeline.daily

      - name: Validate
        run: python schema/validate.py

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add schema/universe.json data/
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "universe: re-rank $(date -u +%Y-%m-%d)"
          git push
