name: rank-universe

# 每交易日盤後重排市值前 60 名單；新進榜股自動回填歷史。
# 分鐘刻意排在 :27（非整點）—— GitHub 排程整點是尖峰、常被延遲甚至丟棄。
# 漏一天不影響：進出場有 KEEP_UNTIL_RANK=70 門檻，隔天會補上。
on:
  schedule:
    - cron: '27 8 * * 1-5' # 16:27 TPE，STOCK_DAY_ALL（~14:30 更新）之後
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e pipeline

      - name: Re-rank universe
        id: rank
        run: python -m twse_pipeline.universe_rank

      - name: Backfill new constituents
        if: steps.rank.outputs.added != ''
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m twse_pipeline.backfill --codes "${{ steps.rank.outputs.added }}"

      - name: Refresh snapshot
        run: python -m twse_pipeline.daily

      - name: Validate
        run: python schema/validate.py

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add schema/universe.json data/
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "universe: re-rank $(date -u +%Y-%m-%d)"
          git push
