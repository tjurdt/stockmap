name: backfill

# 一次性歷史回填（FinMind 原始價 + 配息自行還原）。手動觸發。
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "逗號分隔股票代號（空白 = 整個 universe）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e pipeline

      - name: Backfill price history + rebuild factor history
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m twse_pipeline.backfill --codes "${{ inputs.codes }}"

      - name: Refresh snapshot
        run: python -m twse_pipeline.daily

      - name: Validate
        run: python schema/validate.py

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "backfill: $(date -u +%Y-%m-%d)"
          git push
