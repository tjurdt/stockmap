name: fetch-twse

on:
  schedule:
    # 台股 13:30 收盤。每 30 分鐘試一次（來源沒更新 twse_pipeline.daily 會自行跳過）。
    # 分鐘刻意排在 :13 / :43 —— GitHub Actions 整點是尖峰，排在整點的 cron 常被延遲甚至丟棄。
    - cron: '13,43 5-13 * * 1-5' # 13:13 ~ 21:43 TPE
    - cron: '13 1 * * 2-6' # 09:13 TPE 隔日 — 前一晚都沒抓到時的保險
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline
        run: python -m pip install -e pipeline

      - name: Fetch data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m twse_pipeline.daily

      - name: Validate
        run: python schema/validate.py

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
