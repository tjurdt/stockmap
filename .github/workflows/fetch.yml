name: fetch-twse

on:
  schedule:
    - cron: '0 6 * * 1-5' # 14:00 TPE — 收盤後 30 分，FinMind 通常已更新
    - cron: '0 10 * * 1-5' # 18:00 TPE — 補抓（下午的資料修正 / FinMind 較晚更新）
    - cron: '0 1 * * 2-6' # 09:00 TPE 隔日 — 前一晚都沒抓到時的保險
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline
        run: python -m pip install -e pipeline

      - name: Fetch data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m twse_pipeline.daily

      - name: Validate
        run: python schema/validate.py

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
